<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Lista de tarefas</h1>

    <form id="form-tarefa">
      <input type="text" id="input-tarefa" placeholder="O que precisa ser feito?" autocomplete="off">
      <button type="submit">Adicionar</button>
    </form>

    <div id="filtros">
      <button type="button" data-filtro="todas" class="filtro-ativo">Todas</button>
      <button type="button" data-filtro="pendentes">Pendentes</button>
      <button type="button" data-filtro="concluidas">Concluidas</button>
    </div>

    <ul id="lista-tarefas"></ul>

    <p id="contador"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
